<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>agentbox · Terminal</title>
<!-- PROTOTIPE terminal WebUI. xterm.js (MIT) disimpan lokal di vendor/, tanpa CDN. -->
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --paper: #eef1f4;
    --surface: #ffffff;
    --ink: #1d2733;
    --muted: #5b6673;
    --line: #cbd3dc;
    --accent: #2f5d8a;
    --run: #1e7f5c;
    --err: #b23b3b;
    --term: #111820;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151b22;
      --surface: #1d252f;
      --ink: #e4e9ef;
      --muted: #97a2ae;
      --line: #334050;
      --accent: #7fa8d1;
      --run: #4cc29a;
      --err: #e07b7b;
      --term: #0b1016;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    /* --app-h = tinggi area yang benar-benar terlihat (di atas keyboard Android), diisi JS. */
    height: var(--app-h, 100%);
    margin: 0;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Roboto", sans-serif;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .bar a { color: var(--accent); text-decoration: none; font-size: 14px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  select, button, input {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    min-height: 38px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; }
  /* Saat input fokus (keyboard kemungkinan terbuka) dan WebView tidak mengecilkan viewport:
     pendekkan seluruh halaman agar baris aktif terminal tetap di atas keyboard. */
  body.kb-open { height: calc(var(--app-h, 100vh) * var(--kb-frac, .55)); }
  body.kb-open .bnav { display: none; }
  #term {
    flex: 1;
    min-height: 96px;
    background: var(--term);
    border-radius: 10px;
    padding: 6px;
    overflow: hidden;
  }
  .keys { display: flex; gap: 4px; overflow-x: auto; }
  .keys button { flex: 0 0 auto; min-width: 44px; padding: 6px 8px; font-size: 14px; }
  .hint { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .hint b { color: var(--ink); font-weight: 600; }
  .stat { font: 12px/1.3 ui-monospace, monospace; color: var(--muted); }
  .stat b { color: var(--run); font-weight: 600; }
  .stat .dead { color: var(--err); }
</style>
</head>
<body data-page="tty" data-nav="inline">
  <div class="bar">
    <!-- Urutan = alur setup. Teks opsi diberi status oleh refreshProfiles() (tty.sh profiles). -->
    <select id="profile" aria-label="Perintah">
      <option value="setup" data-label="setup (semua komponen)">setup (semua komponen)</option>
      <option value="hermes-install" data-label="install Hermes">install Hermes</option>
      <option value="claude-login" data-label="login Claude Code">login Claude Code</option>
      <option value="hermes-setup" data-label="hermes setup">hermes setup</option>
      <option value="hermes-model" data-label="hermes model">hermes model</option>
      <option value="hermes-reinstall" data-label="pasang ulang Hermes">pasang ulang Hermes</option>
      <option value="gateway-setup" data-label="gateway setup">gateway setup</option>
      <option value="hermes-auth" data-label="login Hermes (Anthropic)">login Hermes (Anthropic)</option>
      <option value="demo" data-label="Demo (uji input)">Demo (uji input)</option>
    </select>
    <button id="start" class="primary">Mulai</button>
    <button id="stop" disabled>Hentikan</button>
  </div>
  <p class="hint" id="hint"></p>
  <div id="term"></div>
  <!-- Baris tombol di bawah terminal. Tetap di atas keyboard Android karena saat input fokus
       halaman dipendekkan (body.kb-open), sebab WebView KernelSU tidak melaporkan tinggi keyboard. -->
  <div class="keys" id="keys">
    <button id="kbd" aria-pressed="false" title="Keyboard Android">⌨ mati</button>
    <button data-k="\x1b">Esc</button>
    <button data-k="\t">Tab</button>
    <button data-k="\x03">Ctrl-C</button>
    <button data-k="\x1b[A">↑</button>
    <button data-k="\x1b[B">↓</button>
    <button data-k="\x1b[D">←</button>
    <button data-k="\x1b[C">→</button>
    <button data-k=" ">Spasi</button>
    <button data-k="\r">Enter</button>
    <button id="paste" title="Tempel dari clipboard (mis. kode login)">Tempel</button>
  </div>
  <div class="stat" id="stat">siap</div>

<script src="app.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script>
(() => {
  "use strict";
  const TTY = "sh /data/adb/modules/agentbox/lib/tty.sh";

  // ---- ksu.exec -> Promise (sama dengan index.html)
  let seq = 0;
  function run(cmd) {
    return new Promise((resolve) => {
      if (typeof ksu === "undefined" || typeof ksu.exec !== "function") {
        resolve({ errno: -1, stdout: "", stderr: "API KernelSU tidak tersedia. Buka dari KernelSU Manager." });
        return;
      }
      const cb = "__abtty_cb_" + Date.now() + "_" + (seq++);
      window[cb] = (errno, stdout, stderr) => {
        delete window[cb];
        resolve({ errno: Number(errno), stdout: stdout || "", stderr: stderr || "" });
      };
      try { ksu.exec(cmd, "{}", cb); } catch (e) { delete window[cb]; resolve({ errno: -1, stdout: "", stderr: String(e) }); }
    });
  }

  // ---- base64 <-> byte (UTF-8)
  const enc = new TextEncoder();
  function toB64(str) {
    const bytes = enc.encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function fromB64(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Tempel clipboard ke terminal (mis. kode login OAuth). Baris baru dibuang agar tidak langsung "Enter";
  // WebView bisa menolak Clipboard API -> arahkan ke tempel lewat keyboard.
  async function pasteClipboard() {
    if (!alive) { toast("Mulai sesi dulu"); return; }
    try {
      const text = (await navigator.clipboard.readText()).replace(/[\r\n]+/g, "");
      if (!text) { toast("Clipboard kosong"); return; }
      queueInput(text);
      toast("Ditempel — tekan Enter untuk mengirim");
    } catch (_) {
      toast("Clipboard tidak bisa dibaca di sini: nyalakan ⌨, lalu tempel dari keyboard");
    }
  }

  function toast(msg) {
    try { ksu.toast(msg); } catch (_) { /* di luar KernelSU */ }
  }

  // ---- buka link di browser bawaan Android (intent VIEW), bukan di WebView ini.
  // URL berasal dari output terminal, jadi hanya http/https yang diterima dan selalu dikutip untuk sh.
  async function openExternal(uri) {
    let url;
    try { url = new URL(uri); } catch (_) { toast("Link tidak valid"); return; }
    if (url.protocol !== "http:" && url.protocol !== "https:") { toast("Hanya link http/https"); return; }
    const href = url.href;                    // sudah dinormalisasi (tanpa spasi/baris baru)
    const quoted = "'" + href.replace(/'/g, "'\\''") + "'";
    toast("Membuka di browser…");
    const r = await run(`am start -a android.intent.action.VIEW -d ${quoted} >/dev/null 2>&1`);
    if (r.errno !== 0) toast("Gagal membuka browser");
  }

  // ---- terminal
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: "ui-monospace, 'Roboto Mono', monospace",
    scrollback: 2000,
    theme: { background: getComputedStyle(document.documentElement).getPropertyValue("--term").trim() || "#111820" },
    // Hyperlink OSC 8 (teks link "tersembunyi" yang dipakai sebagian CLI).
    linkHandler: { activate: (_e, text) => openExternal(text), allowNonHttpProtocols: false },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // URL biasa di output (mis. URL login OAuth) jadi bisa diketuk.
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => openExternal(uri)));
  term.open(document.getElementById("term"));
  fit.fit();

  const $ = (id) => document.getElementById(id);
  const statEl = $("stat");

  let off = 0;
  let baseH = window.innerHeight;           // tinggi penuh (tanpa keyboard) yang pernah terlihat
  let kbGuess = false;                      // input sedang fokus -> keyboard kemungkinan terbuka
  let kbdOn = false;                        // mode keyboard di terminal (tombol ⌨)
  let alive = false;
  let polling = false;
  let lastActivity = 0;
  let readStats = [];      // waktu round-trip read (ms), 20 terakhir
  let lastWriteMs = 0;
  let pending = "";
  let flushTimer = null;
  let writing = false;

  function avg(a) { return a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0; }
  function renderStat(extra) {
    const state = alive ? "<b>berjalan</b>" : "<span class=dead>berhenti</span>";
    // vh: diagnostik prototipe (tinggi window / visualViewport / dasar, dan tebakan keyboard)
    const vv = window.visualViewport;
    const vh = `vh ${window.innerHeight}/${vv ? Math.round(vv.height) : "-"}/${baseH}${kbGuess ? " kb" : ""}`;
    statEl.innerHTML = `${state} · ${term.cols}x${term.rows} · read ~${avg(readStats)} ms · write ${lastWriteMs} ms · ${vh}` + (extra ? " · " + extra : "");
  }
  function setRunning(on) {
    alive = on;
    $("start").disabled = on;
    $("stop").disabled = !on;
    $("profile").disabled = on;
    renderStat();
  }

  // ---- polling output: cepat saat aktif, lambat saat diam, berhenti saat halaman tersembunyi
  async function pollOnce() {
    const t0 = performance.now();
    const r = await run(`${TTY} read ${off}`);
    readStats.push(Math.round(performance.now() - t0));
    if (readStats.length > 20) readStats.shift();
    if (r.errno !== 0) { renderStat("read gagal: " + r.stderr.trim()); return false; }
    let j;
    try { j = JSON.parse(r.stdout); } catch (_) { renderStat("JSON tidak valid"); return false; }
    if (j.off < off) term.reset();           // file output diganti
    if (j.data) { term.write(fromB64(j.data)); lastActivity = Date.now(); }
    off = j.off;
    if (!j.alive && !j.data) {
      setRunning(false);
      term.write(`\r\n\x1b[2m[selesai${j.rc === null ? "" : ", kode " + j.rc}]\x1b[0m\r\n`);
      refreshProfiles();                     // status setup bisa berubah setelah sesi ini
      return false;
    }
    renderStat();
    return true;
  }
  async function pollLoop() {
    if (polling) return;
    polling = true;
    while (alive && !document.hidden) {
      const more = await pollOnce();
      if (!more) break;
      const idle = Date.now() - lastActivity > 2000;
      await new Promise((res) => setTimeout(res, idle ? 700 : 120));
    }
    polling = false;
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && alive) pollLoop(); });

  // ---- input: kumpulkan ketikan ~25 ms, kirim satu panggilan
  function queueInput(data) {
    if (!alive) return;
    pending += data;
    lastActivity = Date.now();
    if (!flushTimer) flushTimer = setTimeout(flush, 25);
  }
  async function flush() {
    flushTimer = null;
    if (writing || !pending) { if (pending && !flushTimer) flushTimer = setTimeout(flush, 25); return; }
    const data = pending;
    pending = "";
    writing = true;
    const t0 = performance.now();
    const r = await run(`${TTY} write ${toB64(data)}`);
    lastWriteMs = Math.round(performance.now() - t0);
    writing = false;
    if (r.errno !== 0) renderStat("write gagal: " + r.stderr.trim());
    if (pending) flush();
  }
  term.onData(queueInput);

  // ---- ukuran
  let resizeTimer = null;
  function onResize() {
    fit.fit();
    renderStat();
    if (!alive) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => run(`${TTY} resize ${term.cols} ${term.rows}`), 200);
  }
  window.addEventListener("resize", onResize);

  // ---- keyboard Android
  // Tinggi halaman = visual viewport, supaya baris tombol selalu tepat di atas keyboard yang terbuka
  // (WebView tidak selalu mengecilkan layout sendiri).
  function viewportH() {
    const vv = window.visualViewport;
    return vv ? vv.height : window.innerHeight;
  }
  function syncViewport() {
    const vv = window.visualViewport;
    const h = viewportH();
    if (!kbGuess) baseH = Math.max(baseH, window.innerHeight, h);
    document.documentElement.style.setProperty("--app-h", Math.round(h) + "px");
    if (vv && vv.offsetTop) window.scrollTo(0, 0);
    // Fallback hanya bila WebView TIDAK mengecilkan viewport sendiri saat keyboard muncul.
    const shrunk = h < baseH * 0.85;
    document.body.classList.toggle("kb-open", kbGuess && !shrunk);
    onResize();
  }
  function setKbGuess(on) {
    if (kbGuess === on) return;
    kbGuess = on;
    // Beri waktu animasi keyboard sebelum mengukur ulang.
    syncViewport();
    setTimeout(syncViewport, 350);
  }
  function isTypingTarget(el) {
    return kbdOn && el === term.textarea;
  }
  document.addEventListener("focusin", (e) => setKbGuess(isTypingTarget(e.target)));
  document.addEventListener("focusout", () => setTimeout(() => setKbGuess(isTypingTarget(document.activeElement)), 50));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncViewport);
    window.visualViewport.addEventListener("scroll", syncViewport);
  }
  syncViewport();

  // Mode keyboard: "mati" = mengetuk terminal tidak memunculkan keyboard (inputmode=none),
  // cocok untuk navigasi menu lewat baris tombol. Untuk mengetik teks, nyalakan ⌨.
  function setKeyboard(on) {
    kbdOn = on;
    if (term.textarea) term.textarea.setAttribute("inputmode", on ? "text" : "none");
    const b = $("kbd");
    b.textContent = on ? "⌨ hidup" : "⌨ mati";
    b.setAttribute("aria-pressed", String(on));
    if (on) {
      // Fokus ulang agar keyboard muncul dengan inputmode baru.
      term.blur();
      setTimeout(() => term.focus(), 0);
    } else if (term.textarea) {
      term.textarea.blur();
      setKbGuess(false);
    }
  }
  setKeyboard(false);

  // ---- status tiap profil: sudah / belum / butuh prasyarat (tty.sh profiles)
  const SETUP_ORDER = ["hermes-install", "claude-login", "hermes-setup", "gateway-setup"];
  let profState = {};
  function labelOf(id) {
    const o = $("profile").querySelector(`option[value="${id}"]`);
    return o ? o.dataset.label : id;
  }
  function nextStep() {
    for (const id of SETUP_ORDER) if (profState[id] && profState[id].state === "todo") return id;
    return null;
  }
  async function refreshProfiles() {
    const r = await run(`${TTY} profiles`);
    let j;
    try { j = JSON.parse(r.stdout); } catch (_) { return; }   // di luar KernelSU: biarkan apa adanya
    profState = {};
    for (const p of j.profiles) profState[p.id] = p;
    const sel = $("profile");
    for (const o of sel.options) {
      const p = profState[o.value];
      if (!p) continue;
      const mark = { done: " ✓", todo: " • belum", blocked: ` — butuh ${labelOf(p.need)}` }[p.state] || "";
      o.textContent = o.dataset.label + mark;
      o.disabled = p.state === "blocked";
    }
    if (!alive && sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = nextStep() || "hermes-install";
    updateHint();
    applyHashProfile();
  }
  // Profil dari tautan halaman lain (tty.html#profile=...): dipilih saja, tidak langsung dimulai.
  let hashApplied = false;
  function applyHashProfile() {
    if (hashApplied) return;
    hashApplied = true;
    const m = /(?:^|[#&])profile=([\w-]+)/.exec(location.hash);
    if (!m) {
      // Tanpa tautan: langsung pilih langkah setup berikutnya yang belum selesai (bila ada).
      const n = nextStep();
      if (n && !alive) { $("profile").value = n; updateHint(); }
      return;
    }
    try { history.replaceState(null, "", location.pathname); } catch (_) { /* abaikan */ }
    const o = $("profile").querySelector(`option[value="${m[1]}"]`);
    if (o && !o.disabled && !alive) { $("profile").value = m[1]; updateHint(); }
  }
  function updateHint() {
    const id = $("profile").value;
    const p = profState[id];
    const parts = [];
    if (p) {
      if (p.state === "done" && id === "hermes-install") parts.push("Hermes sudah terpasang (menjalankan lagi hanya akan dilewati).");
      else if (p.state === "done") parts.push("Sudah dilakukan" + (p.detail ? ` (${p.detail})` : "") + ". Jalankan ulang untuk mengubah.");
      else if (p.state === "todo") parts.push("Belum dilakukan.");
      else if (p.state === "blocked") parts.push(`Belum bisa: selesaikan "${labelOf(p.need)}" dulu.`);
      // Penjelasan login selalu ditambahkan (apa pun statusnya): langkahnya tidak jelas tanpa ini.
      if (id === "claude-login" && p.state !== "blocked") parts.push("Login langganan Claude (Pro/Max/Team): ketuk link yang muncul, setujui di browser, salin kodenya, lalu tekan Tempel → Enter. Hermes bisa ikut memakai login ini (Konfigurasi → Pakai login Claude Code).");
      else if (id === "hermes-auth" && p.state !== "blocked") parts.push("Login Anthropic khusus Hermes (ketuk link, setujui, tempel kode). Tidak perlu bila Hermes memakai login Claude Code.");
      else if (id === "setup") parts.push("Menjalankan agentbox setup: menu komponen (rootfs, paket dasar, Claude Code, Hermes, …); yang sudah selesai dilewati.");
      else if (id === "hermes-reinstall") parts.push("Menjalankan ulang installer Hermes untuk memperbaiki/memperbarui instalasi. Konfigurasi ~/.hermes tidak dihapus; gateway yang sedang berjalan di-restart.");
    }
    if (Object.keys(profState).length) {
      const n = nextStep();
      if (n && n !== id) parts.push(`Langkah berikutnya: <b>${labelOf(n)}</b>.`);
      else if (!n) parts.push("Semua langkah setup sudah selesai.");
    }
    // Isi hanya dari label tetap + detail yang sudah difilter tty.sh (karakter aman).
    $("hint").innerHTML = parts.join(" ");
    if (!alive) $("start").textContent = p && p.state === "done" ? "Jalankan ulang" : "Mulai";
  }
  $("profile").addEventListener("change", updateHint);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !alive) refreshProfiles(); });

  // ---- tombol
  $("start").addEventListener("click", async () => {
    fit.fit();
    term.reset();
    off = 0;
    const prof = $("profile").value;
    const r = await run(`${TTY} start ${prof} ${term.cols} ${term.rows}`);
    if (r.errno !== 0) { term.write("\x1b[31m" + (r.stderr || "gagal memulai").trim() + "\x1b[0m\r\n"); return; }
    setRunning(true);
    lastActivity = Date.now();
    if (kbdOn) term.focus();
    pollLoop();
  });
  $("stop").addEventListener("click", async () => {
    await run(`${TTY} stop`);
    // pollLoop akan menampilkan [selesai] saat membaca status terakhir
    if (!polling) { await pollOnce(); }
  });
  // Tombol layar tidak boleh mengambil fokus: kalau fokus pindah, keyboard Android ikut muncul/hilang.
  $("keys").addEventListener("pointerdown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
  $("keys").addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
  $("keys").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "kbd") { setKeyboard(!kbdOn); return; }
    if (b.id === "paste") { pasteClipboard(); return; }
    // data-k memakai escape gaya JS (\x1b, \t, \r)
    const k = b.dataset.k.replace(/\\x([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
      .replace(/\\t/g, "\t").replace(/\\r/g, "\r");
    queueInput(k);
  });

  // ---- sambung ulang ke sesi yang masih berjalan (mis. setelah halaman ditutup)
  (async () => {
    const r = await run(`${TTY} status`);
    try {
      const j = JSON.parse(r.stdout);
      if (j.alive) {
        $("profile").value = j.profile;
        off = 0;                 // putar ulang seluruh output
        setRunning(true);
        run(`${TTY} resize ${term.cols} ${term.rows}`);
        pollLoop();
        return;
      }
    } catch (_) { /* tanpa KernelSU: biarkan */ }
    renderStat();
  })();
  refreshProfiles();
})();
</script>
</body>
</html>
