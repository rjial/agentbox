<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agentbox · Konfigurasi</title>
<link rel="stylesheet" href="app.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Roboto", sans-serif;
  }
  a { color: var(--accent); }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .items li.key { flex-wrap: wrap; }
  .items li.key .btn { min-height: 34px; padding: 6px 12px; }
  /* Form edit sebaris */
  .editor { flex-basis: 100%; display: grid; gap: 8px; margin-top: 4px; }
  .editor input[type="password"], .editor input[type="text"] {
    width: 100%; font: 14px ui-monospace, "Roboto Mono", monospace; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  }
  .editor .show { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .editor .msg { font-size: 13px; margin: 0; min-height: 1.2em; }
  .editor .msg.err { color: var(--err); }
  .editor .btn.danger { color: var(--err); border-color: var(--err); margin-left: auto; }
  .warn { color: var(--wait); }
  .err-text { color: var(--err); }
  .auth { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body data-page="config">
<main class="page">
  <div class="page-head">
    <h1>Konfigurasi</h1>
  </div>
  <!-- Dirender Preact (vendor/htm-preact.umd.js) dari `agentbox config show --json`. Nilai rahasia hanya pernah
       tampil tersamar; nilai baru dikirim ke CLI lewat stdin (base64) dan tidak disimpan halaman ini.
       Semua teks di-escape otomatis oleh Preact (tidak ada innerHTML). -->
  <div id="app"><section class="card"><p class="muted">Memuat…</p></section></div>
</main>

<script src="app.js"></script>
<script src="vendor/htm-preact.umd.js"></script>
<script>
(() => {
  "use strict";
  const { html, render, useState, useEffect, useRef, useCallback } = window.htmPreact;
  const { MOD, run, cliJson, toast, openUrl, copyText } = window.AB;
  const CLI = `sh ${MOD}/system/bin/agentbox`;
  const BB = "/data/adb/ksu/bin/busybox";
  const KEY_RE = /^[A-Za-z_][A-Za-z0-9_]*$/;   // nama kunci masuk ke perintah shell: wajib lolos ini
  const VAL_RE = /^[!-~]{1,4096}$/;            // sama dengan validasi CLI: ASCII tercetak tanpa spasi
  const RELEASES = "https://github.com/rusty4444/hermes-android/releases";

  const stripAnsi = (s) => String(s || "").replace(/\x1b\[[0-9;]*m/g, "").trim();
  function b64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  // ---------------------------------------------------------------- komponen dasar

  const Chip = ({ cls = "", children }) => html`<span class=${"chip " + cls}>${children}</span>`;
  const Masked = ({ v }) => html`<span class="val">${v}</span>`;
  const Item = ({ name, sub, right }) => html`
    <li><div class="txt"><p class="name">${name}</p>${sub && html`<p class="sub">${sub}</p>`}</div>${right}</li>`;
  const TtyLink = ({ profile, primary, children }) => html`
    <a class=${"btn" + (primary ? " primary" : "")} href=${"tty.html#profile=" + encodeURIComponent(profile)}>${children}</a>`;
  const Note = ({ children }) => html`<p class="note">${children}</p>`;

  // Tombol dua ketukan: ketukan pertama mengganti teks jadi konfirmasi (batal sendiri setelah 4 detik).
  // Dialog JS tidak selalu didukung WebView KernelSU.
  function ConfirmButton({ cls = "btn", confirmText, onConfirm, disabled, children }) {
    const [armed, setArmed] = useState(false);
    useEffect(() => {
      if (!armed) return undefined;
      const t = setTimeout(() => setArmed(false), 4000);
      return () => clearTimeout(t);
    }, [armed]);
    const click = () => { if (armed) { setArmed(false); onConfirm(); } else setArmed(true); };
    return html`<button class=${cls} disabled=${disabled} onClick=${click}>${armed ? confirmText : children}</button>`;
  }

  // Hasil `config auth-check` untuk satu sisi (claude / hermes).
  const AUTH_TEXT = {
    valid: ["ok", "valid"],
    refreshable: ["ok", "login aktif (diperbarui otomatis)"],
    invalid: ["err", "ditolak Anthropic (401)"],
    "wrong-var": ["err", "token di variabel yang salah"],
    offline: ["todo", "tidak bisa dicek (offline?)"],
    none: ["todo", "belum ada kredensial"],
  };
  function AuthLine({ r }) {
    if (r === undefined) return html`<p class="auth">Memeriksa kredensial ke Anthropic…</p>`;
    if (r === null) return html`<p class="auth">Cek kredensial gagal.</p>`;
    if (r.status === "not-anthropic") return null;
    const [cls, text] = AUTH_TEXT[r.status] || ["todo", `tidak bisa dipastikan (HTTP ${r.http || "?"})`];
    const src = r.source === "login" ? "login Claude Code" : r.source === "none" ? "" : r.source.replace(/^(env|hermes):/, "");
    return html`<p class="auth">Kredensial dipakai: ${src ? html`<code>${src}</code>` : "—"} <${Chip} cls=${cls}>${text}<//></p>`;
  }

  // ---------------------------------------------------------------- baris kunci + form edit sebaris

  // kind: "claude" (config/env agentbox) | "hermes" (~/.hermes/.env lewat hermes config set)
  function KeyRow({ kind, k, masked, sub, canDelete, open, onOpen, onClose, onChanged }) {
    const [val, setVal] = useState("");
    const [show, setShow] = useState(false);
    const [msg, setMsg] = useState(null);           // { err, text }
    const [busy, setBusy] = useState(false);
    const inputRef = useRef(null);

    useEffect(() => {
      if (open) { if (inputRef.current) inputRef.current.focus(); }
      else { setVal(""); setShow(false); setMsg(null); }
    }, [open]);

    async function save() {
      const v = val.trim();
      if (!KEY_RE.test(k)) return;
      if (!VAL_RE.test(v)) { setMsg({ err: true, text: "Nilai tidak valid: hanya karakter ASCII tanpa spasi (1–4096)." }); return; }
      // Nilai dioper lewat stdin CLI (base64 di perintah ksu.exec, proses root; /proc Android hidepid).
      const sub = kind === "hermes" ? `config hermes-key ${k} --stdin` : `config set ${k} --stdin`;
      setVal("");
      setBusy(true);
      setMsg({ err: false, text: kind === "hermes" ? "Menyimpan lewat Hermes… (bisa ~10 detik)" : "Menyimpan…" });
      const r = await run(`printf '%s' '${b64(v)}' | ${BB} base64 -d | ${CLI} ${sub}`);
      setBusy(false);
      if (r.errno === 0) { toast(r.stdout.trim().split("\n")[0] || `${k} disimpan`); onChanged(); }
      else setMsg({ err: true, text: stripAnsi(r.stderr || r.stdout) || "Gagal menyimpan" });
    }

    async function del() {
      if (!KEY_RE.test(k)) return;
      setBusy(true);
      setMsg({ err: false, text: "Menghapus…" });
      const r = await run(`${CLI} config unset ${k}`);
      setBusy(false);
      if (r.errno === 0) { toast(`${k} dihapus`); onChanged(); }
      else setMsg({ err: true, text: stripAnsi(r.stderr) || "Gagal menghapus" });
    }

    return html`
      <li class="key">
        <div class="txt"><p class="name">${k}</p>${sub && html`<p class="sub">${sub}</p>`}</div>
        ${masked ? html`<${Masked} v=${masked} />` : html`<${Chip} cls="todo">kosong<//>`}
        <button class="btn" onClick=${open ? onClose : onOpen}>${masked ? "Ubah" : "Isi"}</button>
        ${open && html`
          <div class="editor">
            <input ref=${inputRef} type=${show ? "text" : "password"} value=${val} disabled=${busy}
              autocomplete="off" autocapitalize="off" spellcheck=${false}
              placeholder=${"Tempel nilai baru " + k} aria-label=${"Nilai baru " + k}
              onInput=${(e) => setVal(e.target.value)}
              onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); save(); } }} />
            <label class="show"><input type="checkbox" checked=${show} disabled=${busy}
              onChange=${(e) => setShow(e.target.checked)} /> tampilkan</label>
            <div class="btn-row" style="margin-top:0">
              <button class="btn primary" disabled=${busy} onClick=${save}>Simpan</button>
              <button class="btn" disabled=${busy} onClick=${onClose}>Batal</button>
              ${canDelete && masked && html`
                <${ConfirmButton} cls="btn danger" confirmText="Yakin hapus?" disabled=${busy} onConfirm=${del}>Hapus<//>`}
            </div>
            <p class=${"msg" + (msg && msg.err ? " err" : "")} role="status">${msg ? msg.text : ""}</p>
          </div>`}
      </li>`;
  }

  // ---------------------------------------------------------------- kartu

  function ModelCard({ h }) {
    return html`
      <section class="card"><h2>Model Hermes</h2>
        <ul class="items">
          ${h.model_set
            ? html`<${Item} name="Provider" right=${html`<${Masked} v=${h.provider} />`} />
                   <${Item} name="Model" right=${html`<${Masked} v=${h.model || "?"} />`} />`
            : html`<${Item} name="Provider & model" sub="Template bawaan installer (provider auto)"
                     right=${html`<${Chip} cls="todo">belum diatur<//>`} />`}
        </ul>
        <div class="btn-row">
          ${h.model_set
            ? html`<${TtyLink} profile="hermes-model" primary>Ganti model (hermes model)<//>
                   <${TtyLink} profile="hermes-setup">Setup lengkap (hermes setup)<//>`
            : html`<${TtyLink} profile="hermes-setup" primary>Atur (hermes setup)<//>`}
        </div>
      </section>`;
  }

  function HermesKeysCard({ h, auth, claudeLogin, rowProps, onChanged }) {
    // API_SERVER_KEY dikelola kartu "Aplikasi Hermes Android" (config hermes-api), bukan form kunci biasa.
    const secrets = (h.secrets || []).filter((s) => s.key !== "API_SERVER_KEY");
    const has = (k) => secrets.some((s) => s.key === k);
    const anth = h.provider === "anthropic";
    const [linking, setLinking] = useState(false);

    async function linkClaude() {
      setLinking(true);
      const r = await run(`${CLI} config hermes-link-claude`);
      setLinking(false);
      const out = stripAnsi(r.errno === 0 ? r.stdout : (r.stderr || r.stdout));
      toast(out.split("\n").pop() || (r.errno === 0 ? "Selesai" : "Gagal"));
      onChanged();
    }

    const providerRow = h.provider_key && !h.provider_key_set && html`
      <${KeyRow} kind="hermes" k=${h.provider_key} ...${rowProps("hermes", h.provider_key)}
        sub=${anth
          ? html`Hanya API key berbayar (sk-ant-api…). Langganan Claude Pro/Max/Team: pakai login, bukan kunci ini.
              ${has("ANTHROPIC_TOKEN") && html` <span class="warn">Bila diisi, dipakai lebih dulu daripada ANTHROPIC_TOKEN.</span>`}`
          : `API key untuk provider ${h.provider}`} />`;

    return html`
      <section class="card"><h2>Kunci & token Hermes</h2>
        ${anth && html`<${AuthLine} r=${auth} />`}
        <ul class="items">
          ${secrets.map((s) => html`
            <${KeyRow} key=${s.key} kind="hermes" k=${s.key} masked=${s.masked} ...${rowProps("hermes", s.key)}
              sub=${s.key === "ANTHROPIC_API_KEY" && s.kind === "oauth" && html`<span class="err-text">Token OAuth di slot API key:
                simpan sebagai ANTHROPIC_TOKEN, atau pakai login Claude Code.</span>`} />`)}
          ${providerRow}
          ${!secrets.length && !providerRow && html`<${Item} name="Belum ada" sub="Belum ada API key/token di ~/.hermes/.env"
            right=${html`<${Chip} cls="todo">kosong<//>`} />`}
        </ul>
        ${anth && html`
          <div class="btn-row">
            ${claudeLogin.logged_in && !has("ANTHROPIC_API_KEY") && !has("ANTHROPIC_TOKEN") && !has("CLAUDE_CODE_OAUTH_TOKEN")
              ? html`<${Chip} cls="ok">memakai login Claude Code<//>`
              : claudeLogin.logged_in
              ? html`<${ConfirmButton} cls="btn primary" disabled=${linking} onConfirm=${linkClaude}
                  confirmText="Yakin? Token Anthropic di .env Hermes dikosongkan">
                  ${linking ? "Memproses… (bisa ~10 detik)" : "Pakai login Claude Code"}<//>`
              : html`<${TtyLink} profile="claude-login" primary>Login Claude Code dulu<//>`}
            <${TtyLink} profile="hermes-auth">Login Hermes (Anthropic)<//>
          </div>`}
        <${Note}>Disimpan Hermes sendiri (<code>hermes config set</code>) ke <code>~/.hermes/.env</code>
          (600, milik agent). Gateway yang sedang berjalan di-restart setelah disimpan. Hanya kunci yang sudah ada
          dan kunci provider aktif yang bisa diubah di sini; selebihnya lewat wizard di Terminal.
          ${anth && html` Urutan yang dipakai Hermes: ANTHROPIC_API_KEY → ANTHROPIC_TOKEN → login Claude Code.
          "Pakai login Claude Code" mengosongkan token di .env sehingga Hermes memakai login itu (diperbarui otomatis).`}<//>
      </section>`;
  }

  function ApiCard({ a, onChanged }) {
    const [key, setKey] = useState(null);       // kunci yang sedang ditampilkan (hanya atas permintaan)
    const [busy, setBusy] = useState(false);

    useEffect(() => {                           // jangan biarkan kunci terpampang
      if (key === null) return undefined;
      const t = setTimeout(() => setKey(null), 60000);
      return () => clearTimeout(t);
    }, [key]);

    async function readKey() {
      const r = await run(`${CLI} config hermes-api show`);
      if (r.errno !== 0) { toast("Gagal membaca kunci"); return null; }
      return r.stdout.trim();
    }
    async function reveal() {
      if (key !== null) { setKey(null); return; }
      const k = await readKey();
      if (k) setKey(k);
    }
    async function copy() {
      const k = await readKey();
      if (k) toast((await copyText(k)) ? "Kunci disalin" : "Gagal menyalin; pakai Tampilkan lalu salin manual");
    }
    async function act(cmd) {
      setBusy(true);
      setKey(null);
      const r = await run(`${CLI} config hermes-api ${cmd}`);
      setBusy(false);
      toast(stripAnsi(r.errno === 0 ? r.stdout : (r.stderr || r.stdout)).split("\n")[0] || (r.errno === 0 ? "Selesai" : "Gagal"));
      onChanged();
    }

    const state = !a.enabled ? html`<${Chip}>nonaktif<//>`
      : a.listening ? html`<${Chip} cls="ok">mendengarkan<//>` : html`<${Chip} cls="todo">aktif, gateway berhenti<//>`;
    return html`
      <section class="card"><h2>Aplikasi Hermes Android</h2>
        <ul class="items">
          <${Item} name="API Server" right=${state}
            sub=${a.enabled && !a.listening && html`Jalankan gateway di <a href="gateway.html">halaman Gateway</a>.`} />
          <${Item} name="Host & port" sub="Isi di aplikasi saat menambah koneksi"
            right=${html`<${Masked} v=${`${a.host || "127.0.0.1"} : ${a.port || 8642}`} />`} />
          ${a.enabled && html`
            <li><div class="txt"><p class="name">API Key</p>
              <p class="sub">${key !== null ? html`<code>${key}</code>` : "Disembunyikan"}</p></div>
              <button class="btn" onClick=${reveal}>${key !== null ? "Sembunyikan" : "Tampilkan"}</button></li>`}
        </ul>
        ${a.enabled && !a.loopback && html`<${Note}><${Chip} cls="err">bukan loopback<//>
          API_SERVER_HOST membuat API bisa diakses dari jaringan.<//>`}
        <div class="btn-row">
          ${a.enabled
            ? html`<button class="btn primary" disabled=${busy} onClick=${copy}>Salin kunci</button>
                   <${ConfirmButton} disabled=${busy} confirmText="Yakin ganti kunci?" onConfirm=${() => act("rotate")}>Ganti kunci<//>
                   <${ConfirmButton} disabled=${busy} confirmText="Yakin nonaktifkan?" onConfirm=${() => act("off")}>Nonaktifkan<//>`
            : html`<button class="btn primary" disabled=${busy} onClick=${() => act("on")}>
                     ${busy ? "Memproses… (bisa ~10 detik)" : "Aktifkan API"}</button>`}
          <button class="btn" onClick=${() => openUrl(RELEASES)}>Unduh aplikasi</button>
        </div>
        <${Note}>Klien chat <code>rusty4444/hermes-android</code> terhubung ke Gateway API Server Hermes di HP ini
          (hanya 127.0.0.1, wajib API key). Kunci memberi kendali penuh atas Hermes: simpan hanya di aplikasi itu, dan
          ganti bila bocor. Dashboard (port 9119: Memory, Skills) sengaja tidak diaktifkan, karena di loopback
          ia tanpa login dan bisa diambil alih aplikasi lain. Cron tetap bisa diatur di halaman Konfigurasi
          tanpa dashboard.<//>
      </section>`;
  }

  // ---------------------------------------------------------------- Cron job
  // Prompt dikirim lewat stdin (base64) seperti nilai rahasia: karakter shell di
  // prompt tidak boleh pernah masuk argv. Nama & jadwal divalidasi di sisi halaman
  // juga, tapi CLI yang jadi penentu (cron.sh menolak nama di luar [A-Za-z0-9_-]).
  const CRON_NAME_RE = /^[A-Za-z0-9_-]{1,40}$/;
  const CRON_MAX_PROMPT = 8192;
  const DELIVER_OPTS = [
    ["local", "local — simpan saja"],
    ["all", "all — semua channel"],
    ["origin", "origin — asal dibuat"],
    ["telegram", "telegram"],
    ["discord", "discord"],
    ["signal", "signal"],
  ];

  function CronCard() {
    const [data, setData] = useState(undefined);   // undefined = memuat, null = gagal
    const [name, setName] = useState("");
    const [sched, setSched] = useState("");
    const [deliver, setDeliver] = useState("local");
    const [prompt, setPrompt] = useState("");
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState(null);           // { err, text }

    const load = useCallback(async () => {
      const d = await cliJson(`config cron list --json`);
      setData(d && Array.isArray(d.declared) ? d : null);
    }, []);
    useEffect(() => { load(); }, [load]);

    const nameBad = name.length > 0 && !CRON_NAME_RE.test(name);

    const add = async () => {
      if (!CRON_NAME_RE.test(name)) { setMsg({ err: true, text: "Nama tidak valid: hanya A-Z a-z 0-9 _ -, maksimal 40." }); return; }
      if (!sched.trim()) { setMsg({ err: true, text: "Jadwal belum diisi." }); return; }
      if (!prompt.trim()) { setMsg({ err: true, text: "Prompt belum diisi." }); return; }
      if (prompt.length > CRON_MAX_PROMPT) { setMsg({ err: true, text: `Prompt terlalu panjang (${prompt.length}/${CRON_MAX_PROMPT}).` }); return; }
      setBusy(true); setMsg(null);
      const arg = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
      const cmd = `printf '%s' '${b64(prompt)}' | ${BB} base64 -d | ${CLI} config cron add ${arg(name)} ${arg(sched)} --deliver ${arg(deliver)} --prompt-stdin`;
      const r = await run(cmd);
      setBusy(false);
      if (r.errno !== 0) { setMsg({ err: true, text: stripAnsi(r.stderr || r.stdout) || "Gagal membuat job." }); return; }
      setName(""); setSched(""); setPrompt("");
      setMsg({ err: false, text: "Job dibuat." });
      load();
    };

    const remove = async (n) => {
      setBusy(true); setMsg(null);
      const arg = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
      const r = await run(`${CLI} config cron remove ${arg(n)}`);
      setBusy(false);
      if (r.errno !== 0) { setMsg({ err: true, text: stripAnsi(r.stderr || r.stdout) || "Gagal menghapus." }); return; }
      setMsg({ err: false, text: "Deklarasi dihapus." });
      load();
    };

    const sync = async () => {
      setBusy(true); setMsg(null);
      const r = await run(`${CLI} config cron sync`);
      setBusy(false);
      setMsg({ err: r.errno !== 0, text: stripAnsi(r.stdout || r.stderr) || "Selesai." });
      load();
    };

    return html`
      <section class="card"><h2>Cron job</h2>
        ${data === undefined
          ? html`<p class="muted">Memuat…</p>`
          : data === null
            ? html`<${Note}>Tidak bisa membaca daftar cron.<//>`
            : data.length === 0
              ? html`<${Note}>Belum ada cron job deklaratif.<//>`
              : html`<ul class="items">
                  ${data.map((j) => html`
                    <li key=${j.name}><div class="txt">
                      <p class="name">${j.name}</p>
                      <p class="sub"><code>${j.schedule}</code> → ${j.deliver}</p>
                    </div>
                    <${Chip} cls=${j.in_hermes ? "ok" : "todo"}>${j.in_hermes ? "aktif" : "belum"}<//>
                    <button class="btn" disabled=${busy} onClick=${() => remove(j.name)}>Hapus</button></li>`)}
                </ul>`}
        <div class="field"><label class="field-label" for="cron-name">Nama</label>
          <input class="field-input" id="cron-name" value=${name} placeholder="backup-harian"
            onInput=${(e) => setName(e.target.value)} /></div>
        ${nameBad && html`<p class="note err-text">Nama hanya boleh A-Z a-z 0-9 _ - (maks 40).</p>`}
        <div class="field"><label class="field-label" for="cron-sched">Jadwal</label>
          <input class="field-input" id="cron-sched" value=${sched} placeholder="0 3 * * *  |  every monday 9am  |  30m"
            onInput=${(e) => setSched(e.target.value)} /></div>
        <div class="field"><label class="field-label" for="cron-deliver">Kirim ke</label>
          <select class="field-input" id="cron-deliver" value=${deliver}
            onChange=${(e) => setDeliver(e.target.value)}>
            ${DELIVER_OPTS.map(([v, t]) => html`<option key=${v} value=${v}>${t}</option>`)}
          </select></div>
        <div class="field"><label class="field-label" for="cron-prompt">Prompt</label>
          <textarea class="field-input" id="cron-prompt" rows="3" value=${prompt}
            placeholder="Instruksi mandiri. Job berjalan di sesi baru, tanpa konteks chat."
            onInput=${(e) => setPrompt(e.target.value)}></textarea></div>
        ${msg && html`<p class=${msg.err ? "note err-text" : "note"}>${msg.text}</p>`}
        <div class="btn-row">
          <button class="btn primary" disabled=${busy} onClick=${add}>
            ${busy ? "Memproses…" : "Tambah job"}</button>
          <button class="btn" disabled=${busy} onClick=${sync}>Terapkan semua</button>
        </div>
        <${Note}>Prompt harus mandiri: job berjalan di sesi baru tanpa konteks percakapan ini, dan hasil akhirnya
          baru dikirim bila <code>--deliver</code> menunjuk channel yang terhubung. Job yang dijadwal ulang tiap boot
          aman: yang sudah ada tidak diubah, jadi status pause manual tetap.<//>
      </section>`;
  }

  function GatewayCard({ h }) {
    const t = h.telegram || {};
    return html`
      <section class="card"><h2>Gateway & platform</h2>
        <ul class="items">
          <${Item} name="Gateway" right=${h.gateway_configured
            ? html`<${Chip} cls="ok">dikonfigurasi<//>` : html`<${Chip} cls="todo">belum<//>`} />
          <${Item} name="Telegram"
            sub=${t.configured && html`${t.allowed_users} user diizinkan${t.home_channel ? ", home channel diatur" : ""}
              ${t.allowed_users === 0 && html` <${Chip} cls="err">tanpa daftar user: akses terbuka<//>`}`}
            right=${t.configured ? html`<${Chip} cls="ok">terhubung<//>` : html`<${Chip}>belum<//>`} />
        </ul>
        <div class="btn-row">
          <${TtyLink} profile="gateway-setup" primary=${!h.gateway_configured}>
            ${h.gateway_configured ? "Ubah (gateway setup)" : "Atur (gateway setup)"}<//>
          <a class="btn" href="gateway.html">Status gateway</a>
        </div>
        <${Note}>Platform lain (Discord, Slack, dll.) juga diatur lewat gateway setup.<//>
      </section>`;
  }

  function ClaudeCard({ env, cl, auth, rowProps, onRecheck }) {
    const has = (k) => env.some((e) => e.key === k);
    return html`
      <section class="card"><h2>Claude Code (agentbox)</h2>
        <${AuthLine} r=${auth} />
        <ul class="items">
          <${Item} name="Login akun Claude"
            sub=${cl.logged_in ? (cl.subscription ? `Langganan: ${cl.subscription}` : "Tersimpan di ~/.claude/.credentials.json")
              : "Untuk langganan Pro/Max/Team"}
            right=${html`${cl.logged_in ? html`<${Chip} cls="ok">login<//>` : html`<${Chip} cls="todo">belum<//>`}
              <${TtyLink} profile="claude-login" primary=${!cl.logged_in}>${cl.logged_in ? "Login ulang" : "Login"}<//>`} />
          ${env.map((e) => html`
            <${KeyRow} key=${e.key} kind="claude" k=${e.key} masked=${e.masked} canDelete ...${rowProps("claude", e.key)}
              sub=${e.key === "ANTHROPIC_API_KEY" && e.kind === "oauth" && html`<span class="err-text">Token OAuth di variabel
                yang salah: Claude Code menolaknya, dan karena didahulukan, login pun tidak terpakai. Hapus, lalu login.</span>`} />`)}
          ${!has("ANTHROPIC_API_KEY") && html`
            <${KeyRow} kind="claude" k="ANTHROPIC_API_KEY" canDelete ...${rowProps("claude", "ANTHROPIC_API_KEY")}
              sub="Hanya API key berbayar (sk-ant-api…); tidak perlu bila sudah login." />`}
          ${!has("CLAUDE_CODE_OAUTH_TOKEN") && html`
            <${KeyRow} kind="claude" k="CLAUDE_CODE_OAUTH_TOKEN" canDelete ...${rowProps("claude", "CLAUDE_CODE_OAUTH_TOKEN")}
              sub=${html`Alternatif login: token dari <code>claude setup-token</code> (sk-ant-oat…).`} />`}
        </ul>
        <${Note}>Variabel disimpan di <code>/data/adb/agentbox/config/env</code> (600, root) dan diteruskan ke
          <code>claude</code>. Urutan yang dipakai Claude Code: ANTHROPIC_API_KEY → CLAUDE_CODE_OAUTH_TOKEN → login.<//>
        <div class="btn-row"><button class="btn" onClick=${onRecheck}>Cek ulang kredensial</button></div>
      </section>`;
  }

  // ---------------------------------------------------------------- halaman

  function App() {
    const [cfg, setCfg] = useState(null);
    const [failed, setFailed] = useState(false);
    const [auth, setAuth] = useState(undefined);   // undefined = memeriksa, null = gagal
    const [openKey, setOpenKey] = useState(null);  // satu form edit sekaligus: "kind:KEY"
    const openRef = useRef(null);
    const authSeq = useRef(0);
    openRef.current = openKey;

    const checkAuth = useCallback(async () => {
      const seq = ++authSeq.current;
      setAuth(undefined);
      const r = await cliJson("config auth-check --json");   // butuh jaringan (~1-2 dtk)
      if (seq === authSeq.current) setAuth(r);
    }, []);

    const load = useCallback(async () => {
      const c = await cliJson("config show --json");
      if (!c) { setFailed(true); return; }
      setFailed(false);
      setCfg(c);
      setOpenKey(null);
      checkAuth();
    }, [checkAuth]);

    useEffect(() => {
      load();
      // Muat ulang saat kembali ke halaman, kecuali sedang mengisi form (jangan buang ketikan).
      const onVis = () => { if (!document.hidden && !openRef.current) load(); };
      document.addEventListener("visibilitychange", onVis);
      return () => document.removeEventListener("visibilitychange", onVis);
    }, [load]);

    const rowProps = (kind, k) => ({
      open: openKey === `${kind}:${k}`,
      onOpen: () => setOpenKey(`${kind}:${k}`),
      onClose: () => setOpenKey(null),
      onChanged: load,
    });

    if (failed) return html`
      <section class="card hero" data-tone="err"><p class="hero-word">Tidak bisa membaca konfigurasi</p>
        <p class="hero-detail">Buka halaman ini dari KernelSU Manager (module agentbox).</p></section>`;
    if (!cfg) return html`<section class="card"><p class="muted">Memuat…</p></section>`;

    const h = cfg.hermes || {};
    const authOf = (side) => (auth === undefined ? undefined : auth === null ? null : auth[side]);
    return html`
      ${!h.installed
        ? html`<section class="card hero" data-tone="todo">
            <p class="hero-word">Hermes belum terpasang</p>
            <p class="hero-detail">Pasang Hermes dulu; setelah itu model, kunci, dan gateway bisa diatur di sini.</p>
            <div class="btn-row"><${TtyLink} profile="hermes-install" primary>Install Hermes di Terminal<//></div>
          </section>`
        : html`
          <${ModelCard} h=${h} />
          <${HermesKeysCard} h=${h} auth=${authOf("hermes")} claudeLogin=${cfg.claude_login || {}}
            rowProps=${rowProps} onChanged=${load} />
          <${ApiCard} a=${h.api_server || {}} onChanged=${load} />
          <${CronCard} />
          <${GatewayCard} h=${h} />`}
      <${ClaudeCard} env=${cfg.env || []} cl=${cfg.claude_login || {}} auth=${authOf("claude")}
        rowProps=${rowProps} onRecheck=${checkAuth} />`;
  }

  render(html`<${App} />`, document.getElementById("app"));
})();
</script>
</body>
</html>
